version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # torch resolves from the PyTorch CUDA/CPU indexes pinned in pyproject.toml, so updates
  # stay within the versions those indexes publish. Python stays pinned by .python-version.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
