# Baseline plus every C1 PPO switch turned on. Compare runs of this preset against
# configs/baseline.yaml to measure the switches' combined effect; toggle one at a time
# with --set to measure each in isolation.
ppo:
  lr_schedule: linear
  clip_value_loss: true
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  entropy_schedule: linear
  target_kl: 0.03
train:
  name: tuned
  description: >-
    Turns on every PPO training tweak at once: a learning rate and an exploration bonus that
    both shrink over the run, a limit on how far the value estimate moves per update, and an
    early stop when an update changes the policy too much. Shows whether the tweaks help
    together.
