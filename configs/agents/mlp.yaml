# Baseline with the mlp network: flatten, 2 hidden layers of 256, MLP head. Board-bound.
# Compare its seed sweep against one of configs/baseline.yaml with snakeppo results
# (docs/experiments.md, Comparing runs).
agent:
  name: mlp
train:
  name: agent-mlp
  description: >-
    Swaps the image network for a plain one that reads the board as a flat list of numbers, with
    no sense of which cells are neighbours; shows how much that sense of space helps. Plays only
    the board size it trained on.
