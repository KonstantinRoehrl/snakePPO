# Baseline trained toward growing goal lengths (4, 8, 16, 32 cells), then the full game.
# Compare its seed sweep against one of configs/baseline.yaml with snakeppo results
# (docs/experiments.md, Comparing runs).
curriculum:
  grow: length
train:
  name: curriculum-length
  description: >-
    Starts with short games that count as won once the snake is 4, then 8, 16 and 32 cells long,
    before the full game, so it masters a short snake before a long one.
