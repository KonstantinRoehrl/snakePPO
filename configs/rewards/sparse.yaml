# Baseline with the sparse reward: apples and deaths only, no shaping.
# Compare its seed sweep against one of configs/baseline.yaml with snakeppo results
# (docs/experiments.md, Comparing runs).
reward:
  strategy: sparse
train:
  name: reward-sparse
  description: >-
    Drops every hint: a reward only for eating an apple and a penalty for dying, which shows how
    much the baseline's hints help.
