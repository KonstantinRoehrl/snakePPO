# Baseline reward plus a penalty for the share of free cells the head can no longer reach.
# Compare its seed sweep against one of configs/baseline.yaml with snakeppo results
# (docs/experiments.md, Comparing runs).
reward:
  strategy: free_space
train:
  name: reward-free-space
  description: >-
    Adds a penalty when a move cuts the head off from part of the free board, to teach the snake
    not to trap itself.
