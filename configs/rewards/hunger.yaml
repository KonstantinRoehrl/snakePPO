# Baseline reward plus a per-step hunger ramp and a timeout penalty when the snake starves.
# Compare its seed sweep against one of configs/baseline.yaml with snakeppo results
# (docs/experiments.md, Comparing runs).
reward:
  strategy: hunger
train:
  name: reward-hunger
  description: >-
    Adds a small penalty that grows the longer the snake goes without an apple, plus a bigger
    one when it starves, to push it to stop circling and go eat.
