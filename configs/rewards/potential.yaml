# Baseline with potential-based shaping on the distance to the food, discounted by
# ppo.gamma, which leaves the optimal policy unchanged.
# Compare its seed sweep against one of configs/baseline.yaml with snakeppo results
# (docs/experiments.md, Comparing runs).
reward:
  strategy: potential
train:
  name: reward-potential
  description: >-
    Swaps the baseline's hint toward the apple for a textbook form (potential-based shaping)
    that guides the snake to food without changing which way of playing is best in the end.
