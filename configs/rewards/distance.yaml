# Baseline with Manhattan-distance shaping: +/- reward.distance_scale per cell toward or
# away from the food.
# Compare its seed sweep against one of configs/baseline.yaml with snakeppo results
# (docs/experiments.md, Comparing runs).
reward:
  strategy: distance
train:
  name: reward-distance
  description: >-
    Swaps the baseline's hint toward the apple for a simpler one: a small fixed reward for each
    step closer and the same penalty for each step away.
